name: Update data & deploy Pages

on:
  schedule:
    # 평일 07:30 KST ≈ 22:30 UTC 전일
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Collect & rebuild (public sources)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          # LS/KRX 는 Actions에서 선택적 — 없으면 기존 raw 유지
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET_KEY: ${{ secrets.LS_APP_SECRET_KEY }}
        run: |
          python - <<'PY'
          from data_collector import fetch_fred_series, fetch_yfinance_prices
          from feature_builder import build_master_dataset
          from correlation_analysis import run_analysis
          print("=== FRED ===")
          try:
              fetch_fred_series()
          except Exception as e:
              print("[WARN] FRED:", e)
          print("=== yfinance ===")
          fetch_yfinance_prices()
          print("=== master ===")
          build_master_dataset(collect_if_missing=False)
          print("=== analysis ===")
          run_analysis()
          PY

      - name: Export Pages JSON
        run: python scripts/export_pages_data.py

      - name: Optional Oracle sync
        env:
          ORACLE_MODE: ${{ secrets.ORACLE_MODE }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_BUCKET: ${{ secrets.OCI_BUCKET }}
          OCI_PREFIX: ${{ secrets.OCI_PREFIX }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
        run: |
          if [ -n "${ORACLE_MODE}" ] && [ "${ORACLE_MODE}" != "off" ]; then
            pip install oci oracledb || true
            python scripts/sync_oracle.py
          else
            echo "Oracle sync skipped (ORACLE_MODE empty/off)"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed docs/data
          git diff --staged --quiet || git commit -m "chore: refresh liquidity dashboard data"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
